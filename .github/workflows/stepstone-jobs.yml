name: Stepstone job collector

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-stepstone-collector]
  schedule:
    # 21:00 UTC = 11 PM CEST daily
    - cron: '0 21 * * *'

concurrency:
  group: stepstone-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      HEADLESS: 'true'
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_NAME_SS: ${{ secrets.GOOGLE_SHEET_NAME_SS || 'ss-raw-data' }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      JOB_TRACKER_API_KEY: ${{ secrets.JOB_TRACKER_API_KEY }}
      MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD || '0' }}
      TOP_N: ${{ vars.TOP_N || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          npx playwright install --with-deps chromium

      - name: Run Stepstone collection (headless)
        env:
          SEARCH_LOCATION: ${{ github.event.client_payload.location }}
          SEARCH_SINCE_PERIOD: ${{ github.event.client_payload.since_period }}
        run: npx playwright test stepstone-jobs
