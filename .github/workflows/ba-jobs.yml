name: Arbeitsagentur job collector

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-ba-collector]
  # Daily at 01:30 CEST (UTC+2) = 23:30 UTC. Offset from Xing (22:30) and LinkedIn (23:00).
  schedule:
    - cron: '30 23 * * *'

concurrency:
  group: ba-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      HEADLESS: 'true'
      # Bundled Chromium works fine — Arbeitsagentur has no bot protection.
      BROWSER_CHANNEL: ''
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      # GOOGLE_SHEET_NAME_BA tells the spec which tab to use (default: ba-raw-data).
      GOOGLE_SHEET_NAME_BA: ${{ secrets.GOOGLE_SHEET_NAME_BA || 'ba-raw-data' }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      JOB_TRACKER_API_KEY: ${{ secrets.JOB_TRACKER_API_KEY }}
      MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD || '0' }}
      TOP_N: ${{ vars.TOP_N || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Arbeitsagentur collection (headless)
        env:
          SEARCH_LOCATION_BA: ${{ github.event.client_payload.location || 'Deutschland' }}
          SEARCH_SINCE_PERIOD: ${{ github.event.client_payload.since_period }}
        run: npx playwright test ba-jobs
