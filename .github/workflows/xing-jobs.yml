name: Xing job collector

# Runs the multi-title Xing collection headless and writes results to Google Sheets.
on:
  # Manual run from the Actions tab.
  workflow_dispatch:
  # External trigger (e.g. Make.com) via the GitHub "repository dispatch" API.
  # Make.com owns the schedule (e.g. daily at 2 PM) and fires this event.
  # Send a POST to /repos/<owner>/<repo>/dispatches with:
  #   { "event_type": "run-xing-collector",
  #     "client_payload": { "location": "...", "since_period": "..." } }
  # client_payload is optional; omit it to use search-config.json values.
  repository_dispatch:
    types: [run-xing-collector]
  # Daily self-run at 00:30 local (CEST, UTC+2) = 22:30 UTC. The :30 minute
  # avoids GitHub's congested top-of-hour queue. NOTE: GitHub cron is fixed UTC
  # and does NOT follow DST; in winter (CET, UTC+1) this lands at 23:30 local —
  # use '30 23 * * *' for 00:30 in winter. Scheduled runs are best-effort and
  # may still start a few minutes late.
  schedule:
    - cron: '30 22 * * *'

# Avoid overlapping runs (each run takes a while and writes the same sheet).
concurrency:
  group: xing-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CI: 'true'
      HEADLESS: 'true'
      # Use real Google Chrome, not bundled Chromium: Xing's bot detection
      # serves a blocked/empty results page to headless Chromium on
      # datacenter IPs (silent 0-results failure), but passes with real Chrome.
      BROWSER_CHANNEL: 'chrome'
      # Google Sheets credentials + target (configured as GitHub secrets).
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
      # Z.AI key for profile match scoring (GitHub secret).
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      # Job Tracker API key to push the top matches (GitHub secret; optional).
      JOB_TRACKER_API_KEY: ${{ secrets.JOB_TRACKER_API_KEY }}
      # Optional matching knobs (repo variables, with defaults).
      MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD || '0' }}
      TOP_N: ${{ vars.TOP_N || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chrome
        run: npx playwright install --with-deps chrome

      - name: Run Xing collection (headless)
        # Optional overrides from a Make.com repository_dispatch payload.
        # Empty for schedule/manual runs -> the spec falls back to search-config.json.
        env:
          SEARCH_LOCATION: ${{ github.event.client_payload.location }}
          SEARCH_SINCE_PERIOD: ${{ github.event.client_payload.since_period }}
        run: npx playwright test xing-all-titles-to-sheet

      # NOTE: sharing is via the Google Sheet (read by the other repo's service
      # account), so there is no GitHub Pages deploy here — Pages isn't available
      # on a private repo on the free plan, and would otherwise fail the run.
