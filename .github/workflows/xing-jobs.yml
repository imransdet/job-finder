name: Xing job collector

# Runs the multi-title Xing collection headless and writes results to Google Sheets.
on:
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Daily schedule (06:00 UTC). Matches the "Past 24 hours" filter.
  # Edit the cron or remove this block if you only want manual runs.
  schedule:
    - cron: '0 6 * * *'

# Avoid overlapping runs (each run takes a while and writes the same sheet).
concurrency:
  group: xing-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      HEADLESS: 'true'
      # Use Playwright's bundled Chromium in CI (no Google Chrome needed).
      BROWSER_CHANNEL: ''
      # Google Sheets credentials + target (configured as GitHub secrets).
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Xing collection (headless)
        run: npx playwright test xing-all-titles-to-sheet

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
