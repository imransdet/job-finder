name: Glassdoor job collector

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-glassdoor-collector]
  # Daily at 23:00 CEST (UTC+2) = 21:00 UTC. Runs between Xing (20:00) and LinkedIn (23:00).
  schedule:
    - cron: '0 21 * * *'

concurrency:
  group: glassdoor-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      HEADLESS: 'true'
      # Use real Chrome (same as Xing) to pass Cloudflare bot-detection on CI datacenter IPs.
      BROWSER_CHANNEL: 'chrome'
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      # GOOGLE_SHEET_NAME_GD tells the spec which tab to use (default: gd-raw-data).
      GOOGLE_SHEET_NAME_GD: ${{ secrets.GOOGLE_SHEET_NAME_GD || 'gd-raw-data' }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      JOB_TRACKER_API_KEY: ${{ secrets.JOB_TRACKER_API_KEY }}
      MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD || '0' }}
      TOP_N: ${{ vars.TOP_N || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chrome
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          npx playwright install --with-deps chrome

      - name: Run Glassdoor collection (headless)
        env:
          SEARCH_LOCATION: ${{ github.event.client_payload.location }}
          SEARCH_SINCE_PERIOD: ${{ github.event.client_payload.since_period }}
        run: npx playwright test glassdoor-jobs
